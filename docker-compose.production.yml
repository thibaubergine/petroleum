version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oil_data
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: oil-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/oil_data
      FRED_API_KEY: ${FRED_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
